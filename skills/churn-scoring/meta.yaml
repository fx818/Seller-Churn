version: "2.0"
category: scoring
python_class: churn-scoring
inputs:
  required:
    - key: glid
      source: snapshot.glid
      type: int
  optional:
    - key: enq_30d
      source: behavioral.bl.received_30d
      type: int
      default: 0
    - key: replied_30d
      source: behavioral.bl.replied_90d
      type: int
      default: 0
    - key: active_days_30d
      source: behavioral.lms.lms_active_days_30d
      type: int
      default: 0
    - key: bl_velocity_pct
      source: derived.bl_velocity_pct
      type: float
    - key: pns_success_pct
      source: derived.pns_success_pct
      type: float
    - key: rag
      source: context.rag_category
      type: str
    - key: cqs
      source: behavioral.activity.cqs
      type: float
    - key: hotleads_count
      source: behavioral.bl.hotleads_count
      type: int
      default: 0
    - key: event_count
      source: behavioral.activity.event_count
      type: int
      default: 0
    - key: trajectory_type
      source: flow.trajectory_type
      type: str
    - key: trajectory_label
      source: flow.trajectory_label
      type: str
    - key: cliff_drop_pct
      source: flow.cliff_drop_pct
      type: float
outputs:
  - key: churn_score
    type: int
  - key: risk
    type: str
  - key: churn_reasons
    type: list
  - key: reason_tags
    type: list
  - key: score_breakdown
    type: dict
  - key: reply_rate_30d
    type: float
  - key: base_score
    type: float
  - key: compound_multiplier
    type: float
  - key: trajectory_adjustment
    type: int
  - key: pre_llm_score
    type: int
  - key: llm_adjustment
    type: int
  - key: llm_justification
    type: str
  - key: llm_used
    type: bool
  - key: red_flag_count
    type: int
