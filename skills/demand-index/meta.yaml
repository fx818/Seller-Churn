version: "1.0"
category: analysis
python_class: demand-index
inputs:
  required:
    - key: glid
      source: snapshot.glid
      type: int
  optional:
    - key: city
      source: context.city
      type: str
    - key: mcats
      source: context.mcats
      type: list
    - key: weekly_bl_active
      source: behavioral.bl.weekly_bl_active
      type: list
    - key: monthly_enq
      source: derived.monthly_enq
      type: list
outputs:
  - key: demand_health
    type: str
  - key: demand_index
    type: int
  - key: city_risk
    type: str
  - key: category_risk
    type: str
  - key: demand_index_result
    type: dict
