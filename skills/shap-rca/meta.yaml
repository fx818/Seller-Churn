version: "1.0"
category: analysis
python_class: shap-rca
inputs:
  required:
    - key: glid
      source: snapshot.glid
      type: int
  optional:
    - key: reason_tags
      source: flow.reason_tags
      type: list
    - key: bl_velocity_pct
      source: derived.bl_velocity_pct
      type: float
    - key: cqs
      source: behavioral.activity.cqs
      type: float
    - key: enq_30d
      source: behavioral.bl.received_30d
      type: int
outputs:
  - key: rca_category
    type: str
  - key: rca_explanation_en
    type: str
  - key: rca_explanation_hi
    type: str
  - key: rca_hint
    type: str
