version: "1.0"
category: messaging
python_class: pre-call-brief
inputs:
  required:
    - key: glid
      source: snapshot.glid
      type: int
  optional:
    - key: company
      source: context.company
      type: str
    - key: city
      source: context.city
      type: str
    - key: enterprise
      source: context.custtype
      type: str
    - key: ctype
      source: context.custtype
      type: str
    - key: account_age_days
      source: context.account_age_days
      type: int
    - key: churn_score
      source: flow.churn_score
      type: int
    - key: risk
      source: flow.risk
      type: str
    - key: rca_category
      source: flow.rca_category
      type: str
    - key: rca_explanation_en
      source: flow.rca_explanation_en
      type: str
    - key: enq_30d
      source: behavioral.bl.received_30d
      type: int
    - key: bl_velocity_pct
      source: derived.bl_velocity_pct
      type: float
    - key: pns_success_pct
      source: derived.pns_success_pct
      type: float
    - key: cqs
      source: behavioral.activity.cqs
      type: float
    - key: active_days_30d
      source: behavioral.lms.lms_active_days_30d
      type: int
    - key: hotleads_count
      source: behavioral.bl.hotleads_count
      type: int
    - key: llm_risk_level
      source: flow.risk_level
      type: str
    - key: llm_bands
      source: flow.bands
      type: dict
    - key: llm_reasoning
      source: flow.reasoning
      type: str
outputs:
  - key: brief_text
    type: str
  - key: opening_line_en
    type: str
  - key: opening_line_hi
    type: str
  - key: key_signals
    type: list
  - key: suggested_actions
    type: list
  - key: call_type
    type: str
