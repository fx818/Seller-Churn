version: "2.0"
category: scoring
python_class: onboarding-health
inputs:
  required:
    - key: glid
      source: snapshot.glid
      type: int
  optional:
    - key: account_age_days
      source: context.account_age_days
      type: int
      default: 0
    - key: city
      source: context.city
      type: str
    - key: enterprise
      source: context.custtype
      type: str
    - key: ctype
      source: context.custtype
      type: str
    - key: cqs
      source: behavioral.activity.cqs
      type: float
    - key: enq_30d
      source: behavioral.bl.received_30d
      type: int
      default: 0
    - key: replied_30d
      source: behavioral.bl.replied_90d
      type: int
      default: 0
    - key: paid_history
      source: context.paid_history
      type: bool
    - key: rag
      source: context.rag_category
      type: str
    - key: company
      source: context.company
      type: str
    - key: mcats
      source: context.mcats
      type: list
    - key: im_product_count
      source: flow.im_product_count
      type: int
    - key: approved_products
      source: behavioral.activity.approved_products
      type: int
    - key: demand_tier
      source: flow.demand_tier
      type: str
    - key: demand_explanation
      source: flow.demand_explanation
      type: str
    - key: demand_index
      source: flow.demand_index
      type: int
    - key: enq_percentile
      source: flow.enq_percentile
      type: float
    - key: peer_median_enq
      source: flow.peer_median_enq
      type: float
    - key: gap_severity
      source: flow.gap_severity
      type: str
outputs:
  - key: health_score
    type: float
  - key: health_tier
    type: str
  - key: checks
    type: dict
  - key: risk_priors
    type: list
  - key: prior_penalty
    type: int
  - key: activation_plan
    type: dict
  - key: plan_method
    type: str
  - key: trigger_action
    type: str
  - key: alerts
    type: list
  - key: recommendations
    type: list
